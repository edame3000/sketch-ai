<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المحول الاحترافي - رسم إلى واقع</title>
    <style>
        :root { --primary: #00d2ff; --dark: #1a1a1a; }
        body { background: var(--dark); color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .header { text-align: center; padding: 20px; background: linear-gradient(135deg, #111, #222); width: 100%; border-bottom: 2px solid var(--primary); }
        .container { display: flex; gap: 20px; padding: 20px; flex-wrap: wrap; justify-content: center; max-width: 1200px; }
        .canvas-card { background: #2a2a2a; padding: 15px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative; }
        canvas { background: white; border-radius: 10px; cursor: crosshair; touch-action: none; width: 512px; height: 512px; }
        .controls { display: flex; flex-direction: column; gap: 15px; width: 300px; padding: 20px; }
        input[type="text"] { padding: 12px; border-radius: 8px; border: none; background: #333; color: white; border: 1px solid #444; }
        button { padding: 12px; border-radius: 8px; border: none; background: var(--primary); color: #000; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { transform: scale(1.05); filter: brightness(1.2); }
        #progressContainer { width: 80%; background: #333; height: 10px; border-radius: 5px; margin: 20px; display: none; overflow: hidden; }
        #progressBar { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; }
        .status-text { font-size: 14px; color: var(--primary); margin-top: 5px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>الذكاء الاصطناعي لتحويل الرسم إلى واقع</h1>
        <p>ارسم فكرتك الهندسية وسأحولها لك لصورة واقعية</p>
    </div>

    <div id="progressContainer">
        <div id="progressBar"></div>
        <center><div class="status-text" id="statusText">جاري تهيئة المتصفح...</div></center>
    </div>

    <div class="container">
        <div class="canvas-card">
            <h3 style="text-align:center">ارسم هنا أو ارفع صورة</h3>
            <canvas id="inputCanvas" width="512" height="512"></canvas>
            <div style="margin-top:10px; display:flex; gap:10px">
                <button onclick="clearCanvas()" style="background:#ff4b2b; color:white">مسح اللوحة</button>
                <input type="file" id="fileInput" accept="image/*" style="display:none">
                <button onclick="document.getElementById('fileInput').click()">رفع صورة</button>
            </div>
        </div>

        <div class="controls">
            <label>وصف الصورة (بالانجليزية):</label>
            <input type="text" id="promptInput" placeholder="مثلاً: Modern living room, realistic interior design">
            <button id="generateBtn">تحويل الرسم إلى واقع ✨</button>
            <div id="aiStatus" style="font-size:12px; color:#888; text-align:center"></div>
        </div>

        <div class="canvas-card">
            <h3 style="text-align:center">النتيجة الواقعية</h3>
            <canvas id="outputCanvas" width="512" height="512"></canvas>
            <button id="downloadBtn" style="width:100%; margin-top:10px; background:#4CAF50; color:white; display:none">حفظ النتيجة</button>
        </div>
    </div>

    <script type="module">
        // استخدام مكتبة مستقرة ونسخة محددة
        import { pipeline, RawImage } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';

        const canvas = document.getElementById('inputCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const outCanvas = document.getElementById('outputCanvas');
        const outCtx = outCanvas.getContext('2d');
        const progressBar = document.getElementById('progressBar');
        const statusText = document.getElementById('statusText');
        const aiStatus = document.getElementById('aiStatus');

        let isDrawing = false;
        let pipe = null;

        // --- أدوات الرسم (تعمل فوراً) ---
        ctx.fillStyle = "white";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = "black";
        ctx.lineWidth = 5;
        ctx.lineCap = "round";

        canvas.addEventListener('mousedown', () => isDrawing = true);
        canvas.addEventListener('mousemove', draw);
        window.addEventListener('mouseup', () => isDrawing = false);

        function draw(e) {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
        }

        window.clearCanvas = () => {
            ctx.fillStyle = "white";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
        };

        // --- تحميل محرك الذكاء الاصطناعي (النسخة المفتوحة) ---
        async function initAI() {
            try {
                document.getElementById('progressContainer').style.display = 'block';
                aiStatus.innerText = "جاري الاتصال بالمحرك العالمي...";
                
                // تم استبدال النموذج لنسخة مفتوحة لا تتطلب 401
                pipe = await pipeline('image-to-image', 'Xenova/stable-diffusion-v1-5-onnx', {
                    device: 'webgpu',
                    dtype: 'q4',
                    progress_callback: (p) => {
                        if (p.status === 'progress') {
                            progressBar.style.width = p.progress + '%';
                            statusText.innerText = `جاري تحميل عقل الـ AI: ${Math.round(p.progress)}%`;
                        }
                    }
                });

                aiStatus.innerText = "✅ المحرك جاهز للعمل";
                document.getElementById('progressContainer').style.display = 'none';
            } catch (err) {
                console.error(err);
                aiStatus.innerText = "⚠️ خطأ: تأكد من استخدام متصفح Chrome وتحديث كرت الشاشة";
                statusText.innerText = "فشل التحميل";
            }
        }

        // --- عملية التحويل ---
        document.getElementById('generateBtn').onclick = async () => {
            if (!pipe) return alert("يرجى الانتظار حتى ينتهي التحميل");
            
            const prompt = document.getElementById('promptInput').value || "high quality architectural render";
            aiStatus.innerText = "جاري التحويل... اترك الماوس";
            
            const imgData = canvas.toDataURL('image/png');
            const result = await pipe(imgData, prompt, {
                strength: 0.7,
                num_inference_steps: 4, // سريع جداً
            });

            const outputImg = await result[0].toCanvas();
            outCtx.drawImage(outputImg, 0, 0, 512, 512);
            document.getElementById('downloadBtn').style.display = 'block';
            aiStatus.innerText = "✅ اكتمل التحويل!";
        };

        // تشغيل التحميل عند فتح الصفحة
        initAI();
    </script>
</body>
</html>
