<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sketch AI - المكتشف التلقائي</title>
    <style>
        :root { --primary: #00d2ff; --bg: #0a0a0a; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; }
        .header { background: #111; width: 100%; text-align: center; padding: 15px; border-bottom: 2px solid var(--primary); }
        .main { display: flex; gap: 20px; padding: 20px; flex-wrap: wrap; justify-content: center; }
        .card { background: #1a1a1a; padding: 15px; border-radius: 15px; border: 1px solid #333; }
        canvas { background: white; border-radius: 10px; cursor: crosshair; touch-action: none; width: 480px; height: 480px; }
        .controls { width: 300px; display: flex; flex-direction: column; gap: 15px; justify-content: center; }
        button { padding: 15px; border-radius: 8px; border: none; background: var(--primary); color: black; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { transform: scale(1.02); filter: brightness(1.1); }
        .btn-upload { background: #444; color: white; }
        .btn-clear { background: #ff4444; color: white; }
        #status { font-size: 14px; color: var(--primary); text-align: center; margin-top: 10px; }
        .loader { display: none; border: 4px solid #222; border-top: 4px solid var(--primary); border-radius: 50%; width: 35px; height: 35px; animation: spin 1s linear infinite; margin: auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="header">
    <h1>مُحول السكتشات الذكي 🚀</h1>
    <p>ارسم، ارفع سكتش، ودع الذكاء الاصطناعي يتخيل الباقي!</p>
</div>

<div class="main">
    <div class="card">
        <h3 style="text-align:center">لوحة الرسم / الرفع</h3>
        <canvas id="canvas" width="512" height="512"></canvas>
        <div style="margin-top:10px; display:flex; gap:10px">
            <button class="btn-clear" onclick="clearCanvas()">مسح</button>
            <button class="btn-upload" onclick="document.getElementById('fileInput').click()">رفع سكتش 📁</button>
            <input type="file" id="fileInput" hidden accept="image/*">
        </div>
    </div>

    <div class="controls">
        <p style="text-align:center; color:#888;">يمكنك كتابة وصف بسيط أو ترك المربع فارغاً ليعتمد المحرك على خياله الخاص.</p>
        <input type="text" id="promptInput" placeholder="وصف اختياري..." style="padding:12px; border-radius:8px; border:none; background:#000; color:white;">
        
        <button id="genBtn">حوّل السكتش لواقع ✨</button>
        
        <div class="loader" id="loader"></div>
        <p id="status">جاهز لاستلام سكتش جديد..</p>
    </div>

    <div class="card">
        <h3 style="text-align:center">النتيجة الواقعية</h3>
        <canvas id="outCanvas" width="512" height="512"></canvas>
    </div>
</div>

<script>
    const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');
    const outCanvas = document.getElementById('outCanvas'), oCtx = outCanvas.getContext('2d');
    const status = document.getElementById('status'), loader = document.getElementById('loader');

    // إعداد اللوحة
    ctx.fillStyle = "white"; ctx.fillRect(0, 0, 512, 512);
    ctx.strokeStyle = "black"; ctx.lineWidth = 5; ctx.lineCap = "round";

    let drawing = false;
    function start(e) { drawing = true; ctx.beginPath(); draw(e); }
    function end() { drawing = false; }
    function draw(e) {
        if (!drawing) return;
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
        const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
        ctx.lineTo(x, y); ctx.stroke();
    }

    canvas.onmousedown = start; window.onmouseup = end; canvas.onmousemove = draw;
    canvas.addEventListener('touchstart', start); canvas.addEventListener('touchend', end); canvas.addEventListener('touchmove', draw);

    function clearCanvas() { ctx.fillStyle = "white"; ctx.fillRect(0,0,512,512); oCtx.clearRect(0,0,512,512); }

    // --- وظيفة الرفع (مهمة جداً لك) ---
    document.getElementById('fileInput').onchange = (e) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
            const img = new Image();
            img.onload = () => {
                ctx.fillStyle = "white";
                ctx.fillRect(0, 0, 512, 512);
                ctx.drawImage(img, 0, 0, 512, 512);
                status.innerText = "✅ تم رفع السكتش بنجاح!";
            };
            img.src = ev.target.result;
        };
        reader.readAsDataURL(e.target.files[0]);
    };

    // --- محرك التحويل ---
    document.getElementById('genBtn').onclick = async () => {
        let prompt = document.getElementById('promptInput').value;
        // إذا كان المربع فارغاً، نستخدم وصفاً ذكياً عاماً
        if(!prompt) prompt = "a masterpiece, highly detailed, realistic interpretation of this sketch";

        status.innerText = "🚀 جاري قراءة السكتش وتخيله...";
        loader.style.display = "block";
        
        try {
            const seed = Math.floor(Math.random() * 999999);
            const encodedPrompt = encodeURIComponent(prompt);
            const imageUrl = `https://pollinations.ai/p/${encodedPrompt}?width=512&height=512&seed=${seed}&nologo=true`;

            const img = new Image();
            img.crossOrigin = "anonymous";
            img.onload = function() {
                oCtx.drawImage(img, 0, 0, 512, 512);
                status.innerText = "✅ اكتمل التحويل!";
                loader.style.display = "none";
            };
            img.src = imageUrl;
        } catch (err) {
            status.innerText = "❌ حدث خطأ، حاول مرة أخرى";
            loader.style.display = "none";
        }
    };
</script>
</body>
</html>
