<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sketch AI - النسخة النهائية المضمونة</title>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 15px; border: 1px solid #333; display: inline-block; max-width: 90%; }
        canvas { background: white; border-radius: 10px; cursor: crosshair; touch-action: none; width: 400px; height: 400px; border: 3px solid #444; }
        button { padding: 15px; border-radius: 8px; border: none; background: #00d2ff; color: black; font-weight: bold; cursor: pointer; margin: 5px; width: 100%; max-width: 200px; }
        #resImg { width: 400px; height: 400px; border-radius: 10px; display: none; margin-top: 20px; border: 2px solid #00d2ff; }
        input[type="text"] { width: 80%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; background: #000; color: white; text-align: center; }
    </style>
</head>
<body>

<h1>محول الرسومات الذكي ✨</h1>

<div class="card">
    <canvas id="c" width="512" height="512"></canvas>
    <br>
    <button onclick="clearC()" style="background:#ff4444; color:white">مسح اللوحة</button>
    <button onclick="document.getElementById('f').click()" style="background:#555; color:white">رفع سكتش 📁</button>
    <input type="file" id="f" hidden accept="image/*">
    
    <hr style="border-color:#333; margin:20px 0;">
    
    <input type="text" id="p" placeholder="اكتب وصفاً للرسمة هنا...">
    <br>
    <button id="go" style="background:#00d2ff; width:90%; max-width:none; font-size:1.1rem;">تحويل الرسمة الآن 🚀</button>
    
    <p id="st" style="color:#00d2ff; margin-top:10px;"></p>
    <img id="resImg">
</div>

<script>
    const c = document.getElementById('c'), ctx = c.getContext('2d');
    const resImg = document.getElementById('resImg'), st = document.getElementById('st');

    // إعداد اللوحة
    ctx.fillStyle = "white"; ctx.fillRect(0,0,512,512);
    ctx.strokeStyle = "black"; ctx.lineWidth = 6; ctx.lineCap = "round";

    let draw = false;
    const getPos = (e) => {
        const r = c.getBoundingClientRect();
        const clientX = e.clientX || (e.touches && e.touches[0].clientX);
        const clientY = e.clientY || (e.touches && e.touches[0].clientY);
        return { x: (clientX - r.left) * (c.width / r.width), y: (clientY - r.top) * (c.height / r.height) };
    };

    c.onmousedown = (e) => { draw = true; ctx.beginPath(); const p = getPos(e); ctx.moveTo(p.x, p.y); };
    window.onmouseup = () => draw = false;
    c.onmousemove = (e) => { if(!draw) return; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); };

    // دعم اللمس للموبايل
    c.ontouchstart = (e) => { draw = true; ctx.beginPath(); const p = getPos(e); ctx.moveTo(p.x, p.y); e.preventDefault(); };
    c.ontouchend = () => draw = false;
    c.ontouchmove = (e) => { if(!draw) return; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); };

    window.clearC = () => { ctx.fillStyle="white"; ctx.fillRect(0,0,512,512); resImg.style.display="none"; st.innerText=""; };

    document.getElementById('f').onchange = (e) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
            const img = new Image();
            img.onload = () => ctx.drawImage(img,0,0,512,512);
            img.src = ev.target.result;
        };
        reader.readAsDataURL(e.target.files[0]);
    };

  document.getElementById('go').onclick = () => {
        const promptText = document.getElementById('p').value || "highly detailed architectural design";
        st.innerText = "جاري التوليد... سيتم فتح الصورة في نافذة جديدة";
        
        const seed = Math.floor(Math.random() * 1000000);
        // الرابط هنا مصمم ليتم فتحه كملف منفصل
        const finalUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(promptText)}?width=512&height=512&seed=${seed}&nologo=true`;

        // لا نحاول عرضها داخل الصفحة، سنفتحها مباشرة في نافذة جديدة لتجاوز الحماية
        window.open(finalUrl, '_blank');
        st.innerText = "✅ تم طلب الصورة، تحقق من النافذة الجديدة!";
    }; 

        resImg.onerror = () => {
            st.innerHTML = `⚠️ المتصفح يحجب العرض المباشر. <br> <a href="${finalUrl}" target="_blank" style="color:#00d2ff; font-weight:bold; font-size:1.2rem;">اضغط هنا لفتح النتيجة في صفحة جديدة</a>`;
        };
    };
</script>
</body>
</html>
