<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المحول الاحترافي - رسم إلى واقع</title>
    <style>
        :root { --accent: #00d2ff; --bg: #1a1a1a; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .app-card { background: #2a2a2a; padding: 25px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); max-width: 900px; width: 100%; }
        .status-area { margin-bottom: 20px; padding: 15px; background: #333; border-radius: 10px; border-right: 5px solid var(--accent); }
        .canvases { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 20px 0; }
        canvas, img { width: 100%; background: white; border-radius: 10px; border: 2px solid #444; }
        .controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .btn { padding: 12px 25px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-primary { background: var(--accent); color: #000; }
        .btn-success { background: #00ff88; color: #000; }
        .progress-bg { width: 100%; height: 8px; background: #444; border-radius: 4px; margin-top: 10px; overflow: hidden; display: none; }
        #progressBar { width: 0%; height: 100%; background: var(--accent); transition: 0.2s; }
        input[type="file"] { margin: 10px 0; color: #ccc; }
    </style>
</head>
<body>

<div class="app-card">
    <div class="status-area">
        <div id="statusText">جاري تهيئة المتصفح...</div>
        <div class="progress-bg" id="progressContainer"><div id="progressBar"></div></div>
    </div>

    <input type="file" id="uploadImg" accept="image/*">
    
    <div class="canvases">
        <div>
            <small>ارسم هنا أو ارفع صورة</small>
            <canvas id="mainCanvas" width="512" height="512"></canvas>
        </div>
        <div>
            <small>النتيجة الواقعية</small>
            <img id="resultImg" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="Result">
        </div>
    </div>

    <div class="controls">
        <button class="btn btn-primary" id="generateBtn" disabled>تحويل إلى واقع ⚡</button>
        <button class="btn" style="background:#ff4444; color:white;" onclick="clearCanvas()">مسح</button>
    </div>
</div>

<script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0';

    // إعدادات البيئة
    env.allowRemoteModels = true;
    env.useBrowserCache = true;

    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('statusText');
    const progressBar = document.getElementById('progressBar');
    const generateBtn = document.getElementById('generateBtn');
    const uploadImg = document.getElementById('uploadImg');
    const resultImg = document.getElementById('resultImg');

    let pipe = null;

    // 1. تسجيل الـ Service Worker
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
    }

    // 2. تحميل النموذج السريع (LCM/Turbo)
    async function initAI() {
        try {
            document.getElementById('progressContainer').style.display = 'block';
            pipe = await pipeline('image-to-image', 'Xenova/sd-turbo-onnx', {
                device: 'webgpu',
                dtype: 'q4',
                progress_callback: (p) => {
                    if (p.status === 'progress') {
                        progressBar.style.width = p.progress + '%';
                        statusText.innerText = `جاري تحميل المحرك: ${Math.round(p.progress)}%`;
                    }
                }
            });
            statusText.innerText = "✅ المحرك جاهز للعمل (Offline)";
            generateBtn.disabled = false;
            document.getElementById('progressContainer').style.display = 'none';
        } catch (e) {
            statusText.innerText = "❌ خطأ: متصفحك لا يدعم WebGPU. استخدم Chrome.";
            console.error(e);
        }
    }

    initAI();

    // 3. نظام الرسم
    let drawing = false;
    canvas.onmousedown = () => drawing = true;
    canvas.onmouseup = () => { drawing = false; ctx.beginPath(); };
    canvas.onmousemove = (e) => {
        if (!drawing) return;
        ctx.lineWidth = 10;
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#000';
        const rect = canvas.getBoundingClientRect();
        ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
        ctx.stroke();
    };

    // 4. رفع صورة
    uploadImg.onchange = (e) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
            const img = new Image();
            img.onload = () => ctx.drawImage(img, 0, 0, 512, 512);
            img.src = ev.target.result;
        };
        reader.readAsDataURL(e.target.files[0]);
    };

    // 5. عملية التوليد
    generateBtn.onclick = async () => {
        statusText.innerText = "🪄 جاري السحر... ثواني فقط";
        generateBtn.disabled = true;

        // استخراج الصورة من الكانفاس
        const imageData = canvas.toDataURL('image/png');
        
        try {
            const output = await pipe(imageData, {
                prompt: "ultra realistic, high definition, masterpiece, 8k",
                num_inference_steps: 2,
                strength: 0.8, // درجة الالتزام بالرسمة (0.1 حرية كاملة، 0.9 التزام بالخطوط)
            });

            resultImg.src = output.toDataURL();
            statusText.innerText = "✅ تم التحويل!";
        } catch (err) {
            console.error(err);
            statusText.innerText = "❌ حدث خطأ أثناء التوليد";
        }
        generateBtn.disabled = false;
    };

    window.clearCanvas = () => ctx.clearRect(0, 0, 512, 512);
</script>
</body>
</html>
