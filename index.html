<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Sketch AI - محول الرسم الذكي</title>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; text-align: center; margin: 0; }
        .nav { background: #1f1f1f; padding: 1rem; border-bottom: 2px solid #00d2ff; }
        .canvas-container { display: flex; justify-content: center; gap: 20px; padding: 20px; flex-wrap: wrap; }
        canvas { background: white; border-radius: 8px; cursor: crosshair; touch-action: none; box-shadow: 0 0 15px rgba(0,0,0,0.5); }
        .controls { background: #1e1e1e; padding: 20px; border-radius: 12px; width: 300px; margin: auto; }
        button { background: #00d2ff; color: black; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin: 5px 0; }
        input { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; }
    </style>
</head>
<body>

<div class="nav"><h1>تحويل الرسم إلى واقع 🎨</h1></div>

<div class="canvas-container">
    <div>
        <h3>لوحة الرسم</h3>
        <canvas id="canvas" width="512" height="512"></canvas>
        <button onclick="clearCanvas()" style="background:#ff4444; color:white">مسح اللوحة</button>
    </div>
    
    <div class="controls">
        <h3>الإعدادات</h3>
        <input type="text" id="prompt" placeholder="اكتب وصفاً بالانجليزية (مثلاً: Modern Villa)">
        <button id="genBtn">تحويل الرسم الآن ✨</button>
        <p id="status" style="color: #888; font-size: 13px;">الحالة: جاهز للرسم</p>
    </div>

    <div>
        <h3>النتيجة</h3>
        <canvas id="outCanvas" width="512" height="512"></canvas>
    </div>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const outCanvas = document.getElementById('outCanvas');
    const oCtx = outCanvas.getContext('2d');
    const status = document.getElementById('status');

    // إعدادات الرسم
    ctx.fillStyle = "white";
    ctx.fillRect(0, 0, 512, 512);
    ctx.strokeStyle = "black";
    ctx.lineWidth = 5;
    ctx.lineCap = "round";

    let drawing = false;

    // وظائف الرسم (تعمل فوراً دون الحاجة لنموذج خارجي)
    canvas.onmousedown = () => { drawing = true; ctx.beginPath(); };
    window.onmouseup = () => drawing = false;
    canvas.onmousemove = (e) => {
        if (!drawing) return;
        const rect = canvas.getBoundingClientRect();
        ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
        ctx.stroke();
    };

    function clearCanvas() {
        ctx.fillRect(0, 0, 512, 512);
        oCtx.clearRect(0, 0, 512, 512);
    }

    // زر التحويل
    document.getElementById('genBtn').onclick = async () => {
        const prompt = document.getElementById('prompt').value;
        if(!prompt) return alert("من فضلك اكتب وصفاً أولاً");

        status.innerText = "⚡ جاري المعالجة عبر السحابة...";
        
        // تحويل الرسم لصورة لإرسالها
        const imageData = canvas.toDataURL('image/jpeg');

        // هنا نقوم بمحاكاة النتيجة مؤقتاً للتأكد من عمل الواجهة
        // في الخطوة القادمة سأعطيك مفتاح API لربطه فعلياً
        setTimeout(() => {
            status.innerText = "✅ تم التحويل بنجاح!";
            oCtx.fillStyle = "#333";
            oCtx.fillRect(0,0,512,512);
            oCtx.fillStyle = "white";
            oCtx.font = "20px Arial";
            oCtx.fillText("النتيجة ستظهر هنا", 180, 250);
        }, 2000);
    };
</script>
</body>
</html>
