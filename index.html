<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sketch AI - محول الرسومات الذكي</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center; 
            padding: 20px;
            min-height: 100vh;
        }
        
        h1 { 
            margin-bottom: 30px; 
            font-size: 2.5rem;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        }
        
        .card { 
            background: rgba(30, 30, 30, 0.9);
            padding: 30px; 
            border-radius: 15px; 
            border: 2px solid #00d2ff;
            display: inline-block; 
            max-width: 95%;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.2);
        }
        
        canvas { 
            background: white; 
            border-radius: 10px; 
            cursor: crosshair; 
            touch-action: none; 
            width: 100%;
            max-width: 400px;
            height: 400px; 
            border: 3px solid #00d2ff;
            display: block;
            margin: 0 auto;
        }
        
        button { 
            padding: 15px 20px; 
            border-radius: 8px; 
            border: none; 
            background: #00d2ff; 
            color: black; 
            font-weight: bold; 
            cursor: pointer; 
            margin: 8px auto; 
            width: 90%;
            max-width: 300px;
            transition: all 0.3s ease;
            font-size: 1rem;
        }
        
        button:hover:not(:disabled) { 
            background: #00b8d4;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 210, 255, 0.3);
        }
        
        button:active:not(:disabled) { transform: translateY(0); }
        
        button:disabled {
            background: #666;
            cursor: not-allowed;
            opacity: 0.6;
        }
        
        #resultImage { 
            width: 100%;
            max-width: 400px;
            height: 400px; 
            border-radius: 10px; 
            display: none; 
            margin-top: 20px; 
            border: 2px solid #00d2ff;
            object-fit: cover;
        }
        
        input[type="text"] { 
            width: 90%;
            max-width: 300px;
            padding: 12px; 
            margin: 10px auto; 
            border-radius: 8px; 
            border: 2px solid #00d2ff;
            background: #000; 
            color: white;
            text-align: center;
            font-size: 1rem;
        }
        
        #status { 
            color: #00d2ff; 
            margin-top: 15px;
            min-height: 20px;
            font-size: 1.1rem;
        }
        
        .status-loading { color: #ffa500; }
        .status-success { color: #00ff00; }
        .status-error { color: #ff4444; }
        
        hr { border-color: #333; margin: 20px 0; }

        .info-box {
            background: rgba(102, 126, 234, 0.2);
            border: 1px solid #00d2ff;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: #b0c4ff;
        }
        
        @media (max-width: 480px) {
            h1 { font-size: 1.8rem; }
            canvas { height: 300px; }
            #resultImage { height: 300px; }
        }

        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid rgba(0, 210, 255, 0.3);
            border-radius: 50%;
            border-top-color: #00d2ff;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .model-selector {
            margin: 15px auto;
        }

        .model-selector select {
            padding: 10px;
            border-radius: 8px;
            border: 2px solid #00d2ff;
            background: #000;
            color: #00d2ff;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

<h1>محول الرسومات الذكي ✨</h1>

<div class="card">
    <div class="info-box">
        ℹ️ رسم على اللوحة أو حمّل صورة، ثم أدخل وصفاً وسيتم توليد صورة محسّنة مجاناً بدون مفتاح API
    </div>

    <canvas id="myCanvas" width="512" height="512"></canvas>
    <br>
    <button onclick="clearCanvas()" style="background: #ff4444; color: white;">مسح اللوحة 🗑️</button>
    <button onclick="document.getElementById('fileInput').click()" style="background: #555; color: white;">رفع سكتش 📁</button>
    <input type="file" id="fileInput" hidden accept="image/*">
    
    <hr>
    
    <div class="model-selector">
        <label for="modelSelect" style="color: #b0c4ff; font-weight: bold;">اختر نموذج الذكاء الاصطناعي:</label>
        <select id="modelSelect">
            <option value="pollinations">Pollinations (الافتراضي)</option>
            <option value="huggingface">Hugging Face (بديل مجاني)</option>
        </select>
    </div>
    
    <input type="text" id="promptInput" placeholder="اكتب وصفاً للرسمة أو للصورة هنا (مثال: حديقة جميلة)..." maxlength="200">
    <br>
    <button id="convertBtn" style="background: #00d2ff; width: 95%; max-width: none; font-size: 1.1rem; margin: 15px auto;">تحويل الرسمة الآن 🚀</button>
    
    <p id="status" style="color: #00d2ff; margin-top: 10px;"></p>
    <img id="resultImage" alt="الصورة المولّدة">
</div>

<script>
    const canvas = document.getElementById('myCanvas');
    const ctx = canvas.getContext('2d');
    const resultImage = document.getElementById('resultImage');
    const statusText = document.getElementById('status');
    const convertBtn = document.getElementById('convertBtn');
    const modelSelect = document.getElementById('modelSelect');

    function initCanvas() {
        ctx.fillStyle = "white";
        ctx.fillRect(0, 0, 512, 512);
        ctx.strokeStyle = "black";
        ctx.lineWidth = 6;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
    }

    initCanvas();

    let isDrawing = false;

    function getPosition(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.clientX || (e.touches && e.touches[0].clientX);
        const clientY = e.clientY || (e.touches && e.touches[0].clientY);
        return {
            x: (clientX - rect.left) * (canvas.width / rect.width),
            y: (clientY - rect.top) * (canvas.height / rect.height)
        };
    }

    canvas.addEventListener('mousedown', (e) => {
        isDrawing = true;
        ctx.beginPath();
        const pos = getPosition(e);
        ctx.moveTo(pos.x, pos.y);
    });

    window.addEventListener('mouseup', () => {
        isDrawing = false;
    });

    canvas.addEventListener('mousemove', (e) => {
        if (!isDrawing) return;
        const pos = getPosition(e);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
    });

    canvas.addEventListener('touchstart', (e) => {
        isDrawing = true;
        ctx.beginPath();
        const pos = getPosition(e);
        ctx.moveTo(pos.x, pos.y);
        e.preventDefault();
    }, false);

    canvas.addEventListener('touchend', () => {
        isDrawing = false;
    }, false);

    canvas.addEventListener('touchmove', (e) => {
        if (!isDrawing) return;
        const pos = getPosition(e);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
        e.preventDefault();
    }, false);

    window.clearCanvas = () => {
        initCanvas();
        resultImage.style.display = "none";
        statusText.innerText = "";
    };

    document.getElementById('fileInput').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (ev) => {
            const img = new Image();
            img.onload = () => {
                ctx.clearRect(0, 0, 512, 512);
                ctx.drawImage(img, 0, 0, 512, 512);
                setStatus("✅ تم تحميل الصورة بنجاح", "success");
            };
            img.onerror = () => {
                setStatus("❌ خطأ في تحميل الصورة", "error");
            };
            img.src = ev.target.result;
        };
        reader.onerror = () => {
            setStatus("❌ خطأ في قراءة الملف", "error");
        };
        reader.readAsDataURL(file);
    });

    function setStatus(message, type = "") {
        statusText.innerHTML = message;
        statusText.className = type ? `status-${type}` : "";
    }

    async function generateWithHuggingFace(prompt) {
        try {
            // استخدام نموذج مجاني من Hugging Face
            const response = await fetch(
                `https://api-inference.huggingface.co/models/stabilityai/stable-diffusion-2-1`,
                {
                    headers: { Authorization: `Bearer hf_free` },
                    method: "POST",
                    body: JSON.stringify({ inputs: prompt }),
                }
            );

            if (response.ok) {
                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                resultImage.src = url;
                resultImage.style.display = "block";
                setStatus("✅ تم توليد الصورة بنجاح!", "success");
                convertBtn.disabled = false;
                return true;
            } else {
                return false;
            }
        } catch (error) {
            console.log("Hugging Face error:", error);
            return false;
        }
    }

    function generateWithPollinations(prompt) {
        const seed = Math.floor(Math.random() * 1000000);
        const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=512&height=512&seed=${seed}&nologo=true`;

        const img = new Image();
        img.crossOrigin = "anonymous";
        
        img.onload = () => {
            resultImage.src = imageUrl;
            resultImage.style.display = "block";
            setStatus("✅ تم توليد الصورة بنجاح!", "success");
            convertBtn.disabled = false;
        };

        img.onerror = () => {
            setStatus("⚠️ تم فتح الصورة في نافذة جديدة", "success");
            window.open(imageUrl, '_blank');
            convertBtn.disabled = false;
        };

        img.src = imageUrl;

        setTimeout(() => {
            if (convertBtn.disabled && !resultImage.src) {
                convertBtn.disabled = false;
                setStatus("⏱️ انتهت المهلة الزمنية، تحقق من النافذة الجديدة أو حاول مجدداً", "error");
            }
        }, 20000);
    }

    convertBtn.addEventListener('click', async () => {
        const promptText = document.getElementById('promptInput').value.trim();

        if (!promptText) {
            setStatus("⚠️ يرجى إدخال وصف للرسمة", "error");
            return;
        }

        setStatus('<span class="spinner"></span>جاري توليد الصورة...', "loading");
        convertBtn.disabled = true;

        try {
            const model = modelSelect.value;

            if (model === "huggingface") {
                const success = await generateWithHuggingFace(promptText);
                if (!success) {
                    setStatus("⚠️ Hugging Face غير متاح، جاري استخدام Pollinations...", "loading");
                    generateWithPollinations(promptText);
                }
            } else {
                generateWithPollinations(promptText);
            }
        } catch (error) {
            setStatus("❌ حدث خطأ: " + error.message, "error");
            convertBtn.disabled = false;
        }
    });

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(err => {
            console.log('Service Worker registration failed:', err);
        });
    }
</script>

</body>
</html>
