<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولد النكات العشوائية 😂</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5rem;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
            font-size: 1.1rem;
        }

        .joke-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 1.3rem;
            line-height: 1.6;
            font-weight: 500;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
            transition: all 0.3s ease;
        }

        .joke-box.loading {
            background: linear-gradient(135deg, #FFD89B 0%, #19547B 100%);
        }

        .joke-setup {
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .joke-punchline {
            font-size: 1.1rem;
            color: #FFD700;
            margin-top: 15px;
            font-style: italic;
        }

        .button-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
            min-width: 150px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:active {
            transform: translateY(-1px);
        }

        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            opacity: 0.6;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            border: 2px solid #667eea;
        }

        .btn-secondary:hover {
            background: #667eea;
            color: white;
            transform: translateY(-3px);
        }

        .btn-secondary:active {
            transform: translateY(-1px);
        }

        .status {
            text-align: center;
            font-size: 1rem;
            margin-top: 20px;
            min-height: 24px;
            color: #667eea;
            font-weight: 600;
        }

        .status.error {
            color: #e74c3c;
        }

        .status.success {
            color: #27ae60;
        }

        .joke-type {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .joke-type h3 {
            margin-bottom: 15px;
            color: #333;
        }

        .radio-group {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .radio-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: #666;
        }

        .radio-group input[type="radio"] {
            cursor: pointer;
            width: 18px;
            height: 18px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .joke-box {
                font-size: 1.1rem;
                padding: 20px;
                min-height: 120px;
            }

            button {
                padding: 12px 20px;
                font-size: 0.9rem;
            }

            .button-group {
                flex-direction: column;
            }

            button {
                flex: none;
                width: 100%;
            }
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>😂 مولد النكات</h1>
    <p class="subtitle">احصل على نكتة عشوائية لتضحك</p>

    <div class="joke-type">
        <h3>نوع النكتة:</h3>
        <div class="radio-group">
            <label>
                <input type="radio" name="jokeType" value="any" checked>
                عشوائية
            </label>
            <label>
                <input type="radio" name="jokeType" value="programming">
                برمجة
            </label>
            <label>
                <input type="radio" name="jokeType" value="knock-knock">
                طرقات
            </label>
            <label>
                <input type="radio" name="jokeType" value="general">
                عامة
            </label>
        </div>
    </div>

    <div class="joke-box" id="jokeBox">
    </div>

    <div class="button-group">
        <button class="btn-primary" id="generateBtn" onclick="generateJoke()">احصل على نكتة جديدة 🎉</button>
        <button class="btn-secondary" id="shareBtn" onclick="shareJoke()" style="display: none;">مشاركة 📤</button>
    </div>

    <div class="status" id="status"></div>
</div>

<script>
    let currentJoke = null;
    const jokeBox = document.getElementById('jokeBox');
    const generateBtn = document.getElementById('generateBtn');
    const shareBtn = document.getElementById('shareBtn');
    const statusText = document.getElementById('status');
    const jokeTypeInputs = document.querySelectorAll('input[name="jokeType"]');

    // تهيئة الواجهة
    function initUI() {
        jokeBox.innerHTML = '<p style="color: #999;">اضغط على الزر لإظهار نكتة عشوائية</p>';
        shareBtn.style.display = 'none';
    }

    initUI();

    // الحصول على نكتة من API
    async function generateJoke() {
        const selectedType = document.querySelector('input[name="jokeType"]:checked').value;
        
        // عرض حالة التحميل
        jokeBox.innerHTML = '<div class="spinner"></div>';
        generateBtn.disabled = true;
        statusText.innerText = 'جاري البحث عن نكتة مضحكة... ⏳';
        statusText.className = 'status';
        shareBtn.style.display = 'none';

        try {
            let apiUrl = 'https://official-joke-api.appspot.com/random_joke';

            // اختيار النوع المناسب
            if (selectedType === 'programming') {
                apiUrl = 'https://official-joke-api.appspot.com/jokes/programming/random';
            } else if (selectedType === 'knock-knock') {
                apiUrl = 'https://official-joke-api.appspot.com/jokes/knock-knock/random';
            } else if (selectedType === 'general') {
                apiUrl = 'https://official-joke-api.appspot.com/random_joke';
            } else {
                // عشوائي من جميع الأنواع
                const types = ['general', 'programming', 'knock-knock'];
                const randomType = types[Math.floor(Math.random() * types.length)];
                if (randomType !== 'general') {
                    apiUrl = `https://official-joke-api.appspot.com/jokes/${randomType}/random`;
                }
            }

            const response = await fetch(apiUrl);
            
            if (!response.ok) {
                throw new Error('خطأ في الاتصال بـ API');
            }

            let data = await response.json();

            // التعامل مع الحالات المختلفة
            if (Array.isArray(data)) {
                data = data[0];
            }

            currentJoke = data;
            displayJoke(data);
            
            statusText.innerText = '✅ تم تحميل النكتة بنجاح!';
            statusText.className = 'status success';
            shareBtn.style.display = 'inline-block';

        } catch (error) {
            console.error('خطأ:', error);
            jokeBox.innerHTML = `<p style="color: #fff;">❌ حدث خطأ في تحميل النكتة<br>${error.message}</p>`;
            statusText.innerText = '❌ فشل تحميل النكتة، حاول مجدداً';
            statusText.className = 'status error';
            shareBtn.style.display = 'none';
        } finally {
            generateBtn.disabled = false;
        }
    }

    // عرض النكتة
    function displayJoke(joke) {
        let jokeHTML = '';

        if (joke.setup && joke.delivery) {
            // نكتة بجزأين (setup و delivery)
            jokeHTML = `
                <div>
                    <div class="joke-setup">${joke.setup}</div>
                    <div class="joke-punchline">${joke.delivery}</div>
                </div>
            `;
        } else if (joke.setup && joke.punchline) {
            // نكتة بجزأين (setup و punchline)
            jokeHTML = `
                <div>
                    <div class="joke-setup">${joke.setup}</div>
                    <div class="joke-punchline">${joke.punchline}</div>
                </div>
            `;
        } else if (joke.joke) {
            // نكتة بسطر واحد
            jokeHTML = `<div>${joke.joke}</div>`;
        } else {
            jokeHTML = '<div>لم تتمكن من تحميل النكتة</div>';
        }

        jokeBox.innerHTML = jokeHTML;
    }

    // مشاركة النكتة
    function shareJoke() {
        if (!currentJoke) return;

        let jokeText = '';
        if (currentJoke.setup && currentJoke.delivery) {
            jokeText = `${currentJoke.setup}\n${currentJoke.delivery}`;
        } else if (currentJoke.setup && currentJoke.punchline) {
            jokeText = `${currentJoke.setup}\n${currentJoke.punchline}`;
        } else if (currentJoke.joke) {
            jokeText = currentJoke.joke;
        }

        if (navigator.share) {
            // استخدام Web Share API
            navigator.share({
                title: 'نكتة مضحكة! 😂',
                text: jokeText
            }).catch(err => console.log('خطأ في المشاركة:', err));
        } else {
            // نسخ إلى الحافظة
            navigator.clipboard.writeText(jokeText).then(() => {
                statusText.innerText = '✅ تم نسخ النكتة إلى الحافظة!';
                statusText.className = 'status success';
                setTimeout(() => {
                    statusText.innerText = '';
                }, 3000);
            }).catch(err => {
                console.error('خطأ في النسخ:', err);
                statusText.innerText = '❌ حدث خطأ في النسخ';
                statusText.className = 'status error';
            });
        }
    }

    // إضافة اختصار لوحة المفاتيح
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            generateJoke();
        }
    });

    // تحميل نكتة عند تحميل الصفحة
    window.addEventListener('load', () => {
        generateJoke();
    });
</script>

</body>
</html>
